# Points a phone's internet probe at the Pi, so the portal can answer it.
#
# NetworkManager runs its own dnsmasq for the shared access point and
# reads this directory (`--conf-dir=/etc/NetworkManager/dnsmasq-shared.d`),
# so this needs no dnsmasq of its own and changes nothing NetworkManager
# owns.
#
# Only the probe domains are redirected, not every name. A phone on this
# access point has no internet either way, but a blanket redirect would
# also catch the phone's own traffic and make every failure look like
# this access point's fault.
address=/connectivitycheck.gstatic.com/192.168.4.1
address=/connectivitycheck.android.com/192.168.4.1
address=/clients3.google.com/192.168.4.1
address=/clients1.google.com/192.168.4.1
address=/www.gstatic.com/192.168.4.1
address=/captive.apple.com/192.168.4.1
address=/www.msftconnecttest.com/192.168.4.1
address=/www.msftncsi.com/192.168.4.1
address=/detectportal.firefox.com/192.168.4.1
