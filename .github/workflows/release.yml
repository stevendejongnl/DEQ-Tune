name: Test, release, and publish

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest
      # The Pi updater lives in pi-gadget/ and uses the standard library only.
      - run: uv run pytest ../pi-gadget

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  test-e2e:
    runs-on: ubuntu-latest
    # A run that hangs blocks every release behind it, so it fails instead.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # The end-to-end tests start both servers themselves, so both halves
      # need their dependencies.
      - run: uv sync
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      # The apt step of `playwright install --with-deps` hung for over ten
      # minutes on 2026-10-23, and a killed try left apt's lock held, so a
      # retry failed at once. The runner image already carries Chrome's
      # system libraries. So this installs the browser alone, checks that it
      # starts, and runs the apt step only when it does not.
      - name: Install the browser for the end-to-end tests
        working-directory: frontend
        run: |
          timeout 300 npx playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"; then
            sudo timeout 600 npx playwright install-deps chromium
          fi
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  release:
    needs: [test-backend, test-frontend, test-e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      published: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker build -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

  # The Pi installs each release from this tarball. See pi-gadget/deq_updater.py.
  bundle:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Pack and attach the release tarball
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stage="$(mktemp -d)/deq-tune"
          mkdir -p "${stage}/backend"
          cp -r backend/app backend/scripts backend/pyproject.toml backend/uv.lock "${stage}/backend/"
          cp -r data conformance pi-gadget openapi.json "${stage}/"
          cp -r frontend/dist "${stage}/dist"
          echo "${VERSION}" > "${stage}/VERSION"
          find "${stage}" -name '__pycache__' -prune -exec rm -rf {} +
          name="deq-tune-${VERSION}.tar.gz"
          tar -czf "${name}" -C "$(dirname "${stage}")" deq-tune
          sha256sum "${name}" > "${name}.sha256"
          gh release upload "v${VERSION}" "${name}" "${name}.sha256"
